[project]
name = "jobhunt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pyyaml>=6", "psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "respx>=0.21"]

[project.scripts]
jobhunt = "jobhunt.cli:main"

[tool.ruff]
line-length = 100
